<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>外科瓣膜情报聚合助手</title>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; background:#f3f6fb; margin:0; color:#1f2937; }
    .wrap { max-width: 1080px; margin: 24px auto; padding: 0 16px; }
    .card { background:#fff; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); padding:16px; margin-bottom:14px; }
    button { background:#2563eb; color:#fff; border:0; border-radius:8px; padding:10px 14px; cursor:pointer; }
    input { width:100%; max-width:420px; padding:10px; border-radius:8px; border:1px solid #cbd5e1; margin-top:8px; }
    .muted { color:#64748b; font-size:13px; }
    .item { border:1px solid #e2e8f0; border-radius:8px; padding:12px; margin-top:10px; }
    .item h4 { margin:0 0 8px 0; }
    .meta { font-size:13px; color:#475569; margin-bottom:8px; }
    pre { white-space:pre-wrap; background:#0f172a; color:#e2e8f0; padding:10px; border-radius:8px; max-height:260px; overflow:auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>外科瓣膜（Surgical Valve）近 30 天更新聚合</h1>
    <div class="card">
      <button id="fetchBtn">获取并处理最新行业更新（近 30 天）</button>
      <p class="muted">将从 PubMed、Crossref、行业 RSS 自动抓取，去重、排序后取前 15 条并调用大模型重写。</p>
    </div>

    <div class="card">
      <h3>处理结果</h3>
      <div id="result"></div>
    </div>

    <div class="card">
      <h3>发送邮件</h3>
      <label>收件人邮箱</label>
      <input id="recipient" type="email" placeholder="name@example.com" />
      <div style="margin-top:10px;"><button id="sendBtn">发送邮件</button></div>
      <p id="sendStatus" class="muted"></p>
    </div>
  </div>

  <script>
    const result = document.getElementById('result');
    const fetchBtn = document.getElementById('fetchBtn');
    const sendBtn = document.getElementById('sendBtn');
    const sendStatus = document.getElementById('sendStatus');

    function esc(v='') { return v.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    fetchBtn.addEventListener('click', async () => {
      fetchBtn.disabled = true;
      fetchBtn.textContent = '处理中，请稍候...';
      result.innerHTML = '正在抓取与处理...';
      try {
        const r = await fetch('/api/fetch_and_process', { method: 'POST' });
        const data = await r.json();
        if (!data.success) throw new Error(data.error || '未知错误');

        if (!data.items.length) {
          result.innerHTML = '<p>未检索到近 30 天相关内容。</p>';
          return;
        }

        result.innerHTML = `<p>已处理 ${data.count} 条。</p>` + data.items.map(it => `
          <div class="item">
            <h4>${esc(it.title || '无标题')}</h4>
            <div class="meta">${esc(it.published_at || '')} | ${esc(it.source || '')} | <a href="${esc(it.link || '#')}" target="_blank">原文</a></div>
            <pre>${esc(it.processed_markdown || '')}</pre>
          </div>
        `).join('');
      } catch (e) {
        result.innerHTML = `<p style="color:#dc2626;">处理失败：${esc(e.message)}</p>`;
      } finally {
        fetchBtn.disabled = false;
        fetchBtn.textContent = '获取并处理最新行业更新（近 30 天）';
      }
    });

    sendBtn.addEventListener('click', async () => {
      const recipient = document.getElementById('recipient').value.trim();
      sendStatus.textContent = '邮件发送中...';
      try {
        const r = await fetch('/api/send_email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ recipient })
        });
        const data = await r.json();
        if (!data.success) throw new Error(data.error || '未知错误');
        sendStatus.textContent = '邮件发送成功。';
      } catch (e) {
        sendStatus.textContent = `发送失败：${e.message}`;
      }
    });
  </script>
</body>
</html>
